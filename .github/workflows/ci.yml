# Phase 1 CI (owner decisions E1-E29, Phase 1 Step 9), plus the manual b10-hosted job. The only
# secret any workflow may reference is registered in policy/ci-secrets.json. No environments, no deployments.
# Stages of the v5.2 pipeline that need Phase 2/3 outputs are deliberately absent (see README, "CI").
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "0"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

defaults:
  run:
    shell: bash

jobs:
  policy:
    name: Policy (workspace, workflows, install scripts, package age, env, currency literals, migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Node.js 24.21.0 (official setup-node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify Node.js version (I2)
        run: |
          node --version
          test "$(node --version)" = "v24.21.0"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare CI directories
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/toolchain"
          echo "MARKETPLACE_TOOLCHAIN_DIR=$RUNNER_TEMP/toolchain" >> "$GITHUB_ENV"
      - name: Set up pnpm (packageManager pnpm@12.4.2)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "12.4.2"
      - name: Record dependency-defining files
        run: node scripts/policy/integrity.mjs snapshot "$RUNNER_TEMP/integrity.json"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store (written only by main-branch runs)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies (frozen lockfile, install scripts blocked)
        run: pnpm install --frozen-lockfile
      - name: Verify dependency-defining files are unchanged
        run: node scripts/policy/integrity.mjs verify "$RUNNER_TEMP/integrity.json"
      - name: Workspace integrity
        run: node scripts/policy/integrity.mjs workspace
      - name: Workflow policy
        run: node scripts/policy/workflow-policy.mjs
      - name: Install-script policy
        run: node scripts/policy/install-scripts.mjs
      - name: 14-day package-age policy (pnpm-managed packages)
        run: node scripts/policy/package-age.mjs --report "$RUNNER_TEMP/artifacts/package-age.json"
      - name: Environment configuration checks
        run: pnpm run check:env
      - name: Currency-literal check
        run: node scripts/policy/currency-literals.mjs
      - name: Migration policy (naming, headers, RLS coverage, grants, pgTAP plans)
        run: node scripts/policy/migrations.mjs
      - name: Record tool versions
        if: always()
        run: node scripts/ci/checks.mjs tool-versions --job policy --output "$RUNNER_TEMP/artifacts/tool-versions-policy.json"
      - name: Upload sanitised artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14
          if-no-files-found: warn

  security:
    name: Security (gitleaks history and tree, osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Node.js 24.21.0 (official setup-node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify Node.js version (I2)
        run: |
          node --version
          test "$(node --version)" = "v24.21.0"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare CI directories
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/toolchain"
          echo "MARKETPLACE_TOOLCHAIN_DIR=$RUNNER_TEMP/toolchain" >> "$GITHUB_ENV"
      - name: Secret scanning (gitleaks 8.30.1, redacted)
        run: node scripts/security/gitleaks.mjs --require-git --summary "$RUNNER_TEMP/artifacts/gitleaks-summary.json"
      - name: Dependency vulnerability scanning (osv-scanner 2.6.0)
        if: always()
        run: node scripts/security/osv.mjs --summary "$RUNNER_TEMP/artifacts/osv-summary.json"
      - name: Record tool versions
        if: always()
        run: node scripts/ci/checks.mjs tool-versions --job security --output "$RUNNER_TEMP/artifacts/tool-versions-security.json"
      - name: Upload sanitised artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14
          if-no-files-found: error

  lint-typecheck:
    name: Lint and typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Set up Node.js 24.21.0 (official setup-node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify Node.js version (I2)
        run: |
          node --version
          test "$(node --version)" = "v24.21.0"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare CI directories
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/toolchain"
          echo "MARKETPLACE_TOOLCHAIN_DIR=$RUNNER_TEMP/toolchain" >> "$GITHUB_ENV"
      - name: Set up pnpm (packageManager pnpm@12.4.2)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "12.4.2"
      - name: Record dependency-defining files
        run: node scripts/policy/integrity.mjs snapshot "$RUNNER_TEMP/integrity.json"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store (written only by main-branch runs)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies (frozen lockfile, install scripts blocked)
        run: pnpm install --frozen-lockfile
      - name: Verify dependency-defining files are unchanged
        run: node scripts/policy/integrity.mjs verify "$RUNNER_TEMP/integrity.json"
      - name: Lint (ESLint 10.9.1)
        run: pnpm run lint
      - name: Typecheck (strict)
        run: pnpm run typecheck
      - name: Record tool versions
        if: always()
        run: node scripts/ci/checks.mjs tool-versions --job lint-typecheck --output "$RUNNER_TEMP/artifacts/tool-versions-lint-typecheck.json"
      - name: Upload sanitised artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-typecheck
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14
          if-no-files-found: warn

  build-test:
    name: Build, boundaries, tests and tooling (TOOL-2, TOOL-4, TOOL-5, TOOL-6)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Set up Node.js 24.21.0 (official setup-node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify Node.js version (I2)
        run: |
          node --version
          test "$(node --version)" = "v24.21.0"
      - name: Install redis-server from Ubuntu 24.04 (tests start their own servers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends redis-server
          sudo systemctl stop redis-server || true
          sudo systemctl disable redis-server || true
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare CI directories
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/toolchain"
          echo "MARKETPLACE_TOOLCHAIN_DIR=$RUNNER_TEMP/toolchain" >> "$GITHUB_ENV"
      - name: Verify redis-server version
        run: node scripts/ci/checks.mjs redis-version
      - name: Set up pnpm (packageManager pnpm@12.4.2)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "12.4.2"
      - name: Record dependency-defining files
        run: node scripts/policy/integrity.mjs snapshot "$RUNNER_TEMP/integrity.json"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store (written only by main-branch runs)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies (frozen lockfile, install scripts blocked)
        run: pnpm install --frozen-lockfile
      - name: Verify dependency-defining files are unchanged
        run: node scripts/policy/integrity.mjs verify "$RUNNER_TEMP/integrity.json"
      - name: Build all apps and packages
        run: pnpm exec turbo run build --force
      - name: Dependency boundaries (TOOL-6)
        run: pnpm run depcruise
      - name: Generated OpenAPI document and client are current (TOOL-2)
        run: pnpm run check:generated
      - name: Client-bundle environment leakage check
        run: pnpm run check:client-env
      - name: Tests (unit, Supertest API, Redis-down, TOOL-5)
        run: pnpm run test
      - name: Tooling tests
        run: pnpm run test:tooling
      - name: TOOL-4 negative control
        run: pnpm run tool4:negative-control
      - name: Verify dependency-defining files are still unchanged
        run: node scripts/policy/integrity.mjs verify "$RUNNER_TEMP/integrity.json"
      - name: Verify no tracked file changed
        run: |
          git status --porcelain --untracked-files=no > "$RUNNER_TEMP/changed.txt"
          if [ -s "$RUNNER_TEMP/changed.txt" ]; then cat "$RUNNER_TEMP/changed.txt"; exit 1; fi
      - name: Save pnpm store (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Record tool versions
        if: always()
        run: node scripts/ci/checks.mjs tool-versions --job build-test --output "$RUNNER_TEMP/artifacts/tool-versions-build-test.json"
      - name: Upload sanitised artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-test
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14
          if-no-files-found: warn

  tool1:
    name: TOOL-1 (${{ matrix.app }} on the Netlify runtime build)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    steps:
      - name: Set up Node.js 24.21.0 (official setup-node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify Node.js version (I2)
        run: |
          node --version
          test "$(node --version)" = "v24.21.0"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare CI directories
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/toolchain"
          echo "MARKETPLACE_TOOLCHAIN_DIR=$RUNNER_TEMP/toolchain" >> "$GITHUB_ENV"
      - name: Set up pnpm (packageManager pnpm@12.4.2)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "12.4.2"
      - name: Record dependency-defining files
        run: node scripts/policy/integrity.mjs snapshot "$RUNNER_TEMP/integrity.json"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store (written only by main-branch runs)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies (frozen lockfile, install scripts blocked)
        run: pnpm install --frozen-lockfile
      - name: Verify dependency-defining files are unchanged
        run: node scripts/policy/integrity.mjs verify "$RUNNER_TEMP/integrity.json"
      - name: Build the app and its workspace dependencies
        run: pnpm exec turbo run build --filter="@repo/${{ matrix.app }}..."
      - name: TOOL-1 (pinned Deno 2.9.6, deny-all proxy)
        run: node scripts/tool1.mjs "${{ matrix.app }}" > "$RUNNER_TEMP/tool1-raw.json"
      - name: Sanitised TOOL-1 result
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/tool1-raw.json" ]; then
            node scripts/ci/checks.mjs tool1-summary --input "$RUNNER_TEMP/tool1-raw.json" --output "$RUNNER_TEMP/artifacts/tool1-${{ matrix.app }}.json"
          fi
      - name: Record tool versions
        if: always()
        run: node scripts/ci/checks.mjs tool-versions --job tool1-${{ matrix.app }} --output "$RUNNER_TEMP/artifacts/tool-versions-tool1-${{ matrix.app }}.json"
      - name: Upload sanitised artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tool1-${{ matrix.app }}
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14
          if-no-files-found: error

  supabase-local:
    name: Local Supabase stack (migrations, TOOL-3, B10-local, TOOL-7 pgTAP, type drift)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Set up Node.js 24.21.0 (official setup-node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify Node.js version (I2)
        run: |
          node --version
          test "$(node --version)" = "v24.21.0"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare CI directories
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/toolchain"
          echo "MARKETPLACE_TOOLCHAIN_DIR=$RUNNER_TEMP/toolchain" >> "$GITHUB_ENV"
      - name: Set up pnpm (packageManager pnpm@12.4.2)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "12.4.2"
      - name: Record dependency-defining files
        run: node scripts/policy/integrity.mjs snapshot "$RUNNER_TEMP/integrity.json"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store (written only by main-branch runs)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies (frozen lockfile, install scripts blocked)
        run: pnpm install --frozen-lockfile
      - name: Verify dependency-defining files are unchanged
        run: node scripts/policy/integrity.mjs verify "$RUNNER_TEMP/integrity.json"
      - name: Build the database package (TOOL-3 harness)
        run: pnpm exec turbo run build --filter=@repo/db
      - name: Start the local stack with approved images (fails until the owner approves the digest lock)
        id: start
        run: node scripts/ci/supabase-local.mjs start
      # TEMPORARY — EVIDENCE ONLY for the 0012 storage ownership blocker. Read-only: the single
      # ALTER TABLE runs inside BEGIN/ROLLBACK and leaves nothing behind. `if: always()` so it runs
      # after a failed `start`, while the containers are still up. psql comes from the approved,
      # digest-pinned postgres image itself, so no unpinned client is introduced (O-22). Remove this
      # step once the evidence has been captured.
      - name: Storage ownership probe (temporary, read-only evidence)
        if: always()
        run: |
          container="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -1)"
          if [ -z "$container" ]; then
            echo "No supabase_db_ container is running: the stack never reached the database."
            exit 0
          fi
          echo "container: $container"
          echo "host port mapping for 5432: $(docker port "$container" 5432 || echo 'not published')"
          docker exec -i "$container" psql -U postgres -d postgres -f - <<'PROBE_SQL'
          \set VERBOSITY verbose

          \echo === A. current / session role ===
          select current_user, session_user, current_setting('server_version') as server_version;

          \echo === B + C. storage ownership and RLS flags ===
          select c.relname,
                 pg_get_userbyid(c.relowner) as owner,
                 c.relrowsecurity,
                 c.relforcerowsecurity
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'storage' and c.relname in ('objects','buckets')
           order by c.relname;

          \echo === D. membership / INHERIT against the real owners (no SET ROLE) ===
          select distinct
                 c.relname,
                 pg_get_userbyid(c.relowner)                     as owner_role,
                 pg_has_role(current_user, c.relowner, 'USAGE')  as inherits,
                 pg_has_role(current_user, c.relowner, 'MEMBER') as member
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
           where n.nspname = 'storage' and c.relname in ('objects','buckets')
           order by c.relname;

          \echo === D2. how the membership was granted, if it exists ===
          select pg_get_userbyid(m.roleid) as granted_role,
                 pg_get_userbyid(m.member) as member_role,
                 m.admin_option, m.inherit_option, m.set_option
            from pg_auth_members m
           where m.member = (select oid from pg_roles where rolname = current_user);

          \echo === E. role attributes: current_user and the storage owners ===
          select r.rolname, r.rolsuper, r.rolcreaterole, r.rolcreatedb,
                 r.rolinherit, r.rolcanlogin, r.rolbypassrls, r.rolreplication
            from pg_roles r
           where r.rolname = current_user
              or r.oid in (select c.relowner from pg_class c
                             join pg_namespace n on n.oid = c.relnamespace
                            where n.nspname = 'storage' and c.relname in ('objects','buckets'))
           order by r.rolname;

          \echo === 5. do the storage tables predate migration 0012? ===
          select (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace
                   where n.nspname = 'storage' and c.relname in ('objects','buckets'))  as storage_tables_present,
                 (select count(*) from supabase_migrations.schema_migrations
                   where version = '0012')                                              as migration_0012_recorded,
                 (select max(version) from supabase_migrations.schema_migrations)        as last_applied_migration;

          \echo === F. the underlying privilege result, rolled back, changes nothing ===
          begin;
            alter table storage.objects enable row level security;
          rollback;
          PROBE_SQL
      - name: TOOL-3 through the local transaction-mode pooler
        if: always() && steps.start.outcome == 'success'
        run: node scripts/ci/supabase-local.mjs tool3 --result "$RUNNER_TEMP/artifacts/tool3.json"
      - name: B10-local (temporary migration, removed afterwards)
        if: always() && steps.start.outcome == 'success'
        run: node scripts/ci/supabase-local.mjs b10 --result "$RUNNER_TEMP/artifacts/b10-local.json"
      - name: Every committed migration is applied
        if: always() && steps.start.outcome == 'success'
        run: node scripts/ci/supabase-local.mjs migrations --result "$RUNNER_TEMP/artifacts/migrations.json"
      - name: TOOL-7 pgTAP
        if: always() && steps.start.outcome == 'success'
        run: node scripts/ci/supabase-local.mjs pgtap --result "$RUNNER_TEMP/artifacts/tool7-pgtap.json"
      - name: Generated Kysely types match the schema
        if: always() && steps.start.outcome == 'success'
        run: node scripts/ci/supabase-local.mjs types --result "$RUNNER_TEMP/artifacts/schema-types.json"
      - name: Stop the local stack
        if: always()
        run: node scripts/ci/supabase-local.mjs stop
      - name: Record tool versions
        if: always()
        run: node scripts/ci/checks.mjs tool-versions --job supabase-local --output "$RUNNER_TEMP/artifacts/tool-versions-supabase-local.json"
      - name: Upload sanitised artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-local
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: TOOL-7 Playwright smoke (Chromium only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Set up Node.js 24.21.0 (official setup-node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify Node.js version (I2)
        run: |
          node --version
          test "$(node --version)" = "v24.21.0"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare CI directories
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts" "$RUNNER_TEMP/toolchain"
          echo "MARKETPLACE_TOOLCHAIN_DIR=$RUNNER_TEMP/toolchain" >> "$GITHUB_ENV"
      - name: Set up pnpm (packageManager pnpm@12.4.2)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "12.4.2"
      - name: Record dependency-defining files
        run: node scripts/policy/integrity.mjs snapshot "$RUNNER_TEMP/integrity.json"
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store (written only by main-branch runs)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install dependencies (frozen lockfile, install scripts blocked)
        run: pnpm install --frozen-lockfile
      - name: Verify dependency-defining files are unchanged
        run: node scripts/policy/integrity.mjs verify "$RUNNER_TEMP/integrity.json"
      - name: Build web and admin
        run: pnpm exec turbo run build --filter=@repo/web --filter=@repo/admin
      - name: Verify the pinned Chromium build
        run: node scripts/ci/checks.mjs playwright-browser
      - name: Install Chromium for Playwright 1.62.1
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium
      - name: Verify the installed Chromium build
        run: node scripts/ci/checks.mjs playwright-browser --installed
      - name: Playwright smoke tests
        run: pnpm --filter @repo/e2e run test:e2e
      - name: Sanitised Playwright summary
        if: always()
        run: |
          if [ -s packages/e2e/test-results/report.json ]; then
            node scripts/ci/checks.mjs e2e-summary --report packages/e2e/test-results/report.json --output "$RUNNER_TEMP/artifacts/tool7-playwright.json"
          fi
      - name: Record tool versions
        if: always()
        run: node scripts/ci/checks.mjs tool-versions --job e2e --output "$RUNNER_TEMP/artifacts/tool-versions-e2e.json"
      - name: Upload sanitised artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14
          if-no-files-found: warn

  b10-hosted:
    name: "B10-hosted (non-production Supabase: migrations 0001-0037 and verification)"
    # Manual only while the path is being proven: a job that can reach a credential never runs on
    # every push. B10-local (the supabase-local job) is unaffected and keeps running on every trigger.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Set up Node.js 24.21.0 (official setup-node)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - name: Verify Node.js version (I2)
        run: |
          node --version
          test "$(node --version)" = "v24.21.0"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare CI directories
        run: mkdir -p "$RUNNER_TEMP/artifacts"
      # Self-gate. Runs before any step that can reach the secret, so an expired registration stops the
      # job here instead of after a connection has been made. No secret is in scope for this step.
      - name: Secret registration must be active (policy/ci-secrets.json)
        run: node scripts/policy/ci-secrets.mjs assert --name B10_HOSTED_DATABASE_URL --workflow .github/workflows/ci.yml --job b10-hosted
      - name: Set up pnpm (packageManager pnpm@12.4.2)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "12.4.2"
      - name: Install dependencies (frozen lockfile, install scripts blocked)
        run: pnpm install --frozen-lockfile
      - name: Install the approved PostgreSQL client (Ubuntu 24.04 archive, major 16)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
      - name: Verify the psql client major (O-22)
        run: node scripts/ci/checks.mjs psql-version
      # The only step the credential is in scope for. It is never a command-line argument: the runner
      # writes a 0600 .pgpass outside the repository and lets libpq read it.
      - name: Apply migrations 0001-0037 and verify the hosted database
        env:
          B10_HOSTED_DATABASE_URL: ${{ secrets.B10_HOSTED_DATABASE_URL }}
        run: node scripts/ci/supabase-hosted.mjs verify --result "$RUNNER_TEMP/artifacts/b10-hosted.json"
      - name: Record tool versions
        if: always()
        run: node scripts/ci/checks.mjs tool-versions --job b10-hosted --output "$RUNNER_TEMP/artifacts/tool-versions-b10-hosted.json"
      - name: Upload sanitised artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b10-hosted
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14
          if-no-files-found: warn
