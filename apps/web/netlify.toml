# Build configuration only; no Netlify site is created in Phase 1.
# Repository-root-relative build model (Phase 1 Step 9): Netlify resolves paths against the git
# repository root, so `publish` is repo-root-relative and the command is package-scoped. TOOL-1 runs
# `netlify build --offline --filter @repo/web` from the repository root and verifies both.
[build]
  command = "pnpm --filter @repo/web run build"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
