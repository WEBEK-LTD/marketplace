# The app-scoped copy of the Netlify build configuration. **The root `netlify.toml` is authoritative.**
#
# Two files exist because Netlify resolves configuration from the site's base directory, and two different
# directories are in play:
#
#   * **The deployed site** has no base or package directory set, so Netlify reads `/netlify.toml`. That is the
#     file that decides what actually deploys, and it is the one to edit.
#   * **TOOL-1** runs `netlify build --offline --filter @repo/web` from the repository root. `--filter` is the
#     Netlify CLI's monorepo flag: it sets the package directory to this workspace package, so the CLI reads
#     *this* file instead. Without it TOOL-1 would verify a configuration the site never uses.
#
# Keeping both is therefore not duplication for its own sake — it is what lets the verification harness and the
# deployment agree. The hazard is that they drift, so they are not allowed to:
# `scripts/policy/netlify-config.mjs` asserts that both files exist and that their build command, publish
# directory, Node version and plugin list are identical, and `pnpm run check:policy` fails if they are not.
#
# Everything below is explained at length in the root file, including why the `...` suffix in the filter is
# load-bearing and why the publish path is repository-root-relative. One Next.js application serves the public
# marketplace at `/` and the staff console at `/admin` (0108); there is no admin site and no admin hostname.
[build]
  command = "pnpm --filter \"@repo/web...\" run build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24.21.0"

[[plugins]]
  package = "@netlify/plugin-nextjs"
