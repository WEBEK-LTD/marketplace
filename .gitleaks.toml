# gitleaks 8.30.1 configuration (owner decision E16): the default rules, with installed and generated
# directories excluded from the working-tree scan. Nothing else is excluded.
[extend]
useDefault = true

[allowlist]
description = "Installed and generated directories (never committed)"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.netlify/''',
  '''(^|/)\.turbo/''',
  '''(^|/)dist/''',
  '''(^|/)test-results/''',
  '''(^|/)playwright-report/''',
  '''^supabase/\.temp/''',
]
